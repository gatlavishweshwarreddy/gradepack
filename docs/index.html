<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gradepack leaderboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.5; background: #fff; color: #1f2328; padding: 24px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #57606a; margin-bottom: 24px; font-size: 13px; }
  h2 { font-size: 1rem; font-weight: 600; margin: 28px 0 8px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  th { text-align: left; padding: 5px 8px; background: #f7f8fa; border-bottom: 2px solid #e5e7eb; white-space: nowrap; }
  td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .bar-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .score-bar { display: inline-block; height: 8px; background: #3b82d4; border-radius: 2px; min-width: 2px; }
  .score-zero { background: #e5e7eb; }
  .pct { font-size: 12px; color: #57606a; }
  .tag { display: inline-block; padding: 1px 5px; border-radius: 10px; font-size: 11px; font-weight: 500; margin: 1px; }
  .tag-easy    { background: #e8f8f0; color: #1a7a4a; }
  .tag-medium  { background: #fff8e1; color: #a16207; }
  .tag-hard    { background: #fdecea; color: #b91c1c; }
  .tag-fail    { background: #fff0f0; color: #c0392b; }
  .tag-none    { background: #e8f8f0; color: #1a7a4a; }
  .tag-info    { background: #f0f4ff; color: #3b5bdb; }
  .empty       { color: #57606a; font-style: italic; }
  .mock-banner { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; margin-left: 10px; vertical-align: middle; }
  .summary-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
  .summary-stat { font-size: 13px; }
  .summary-stat strong { font-size: 1.05rem; color: #3b82d4; }
  .reason-table { font-size: 12px; margin-bottom: 8px; }
  .reason-table td { padding: 2px 8px; }
  #status { color: #57606a; font-size: 13px; margin: 8px 0 16px; }
  code { font-size: 12px; background: #f7f8fa; padding: 1px 3px; border-radius: 3px; }
</style>
</head>
<body>
<h1>gradepack leaderboard</h1>
<p class="subtitle">
  Loads <code>results/index.json</code> then each <code>results/*.json</code>.
  Files starting with "mock" show a MOCK DATA banner.
  Run <code>python -m gradepack bench --publish</code> to push results here.
</p>
<div id="status">Loading…</div>
<div id="root"></div>

<script>
// ── helpers ───────────────────────────────────────────────────────────────────

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function tag(cls, text) { return el('span', {class: 'tag ' + cls}, text); }

function barCell(score) {
  if (score === null) return el('td', {}, el('span', {class:'empty'}, '—'));
  const pct = Math.round(score * 100);
  const bar = el('span', {
    class: 'score-bar' + (pct === 0 ? ' score-zero' : ''),
    style: {width: Math.max(2, pct * 0.8) + 'px'}
  });
  return el('td', {}, el('span', {class:'bar-wrap'}, bar, el('span', {class:'pct'}, pct + '%')));
}

// ── pass@k ────────────────────────────────────────────────────────────────────

function comb(n, k) {
  if (k > n || k < 0) return 0;
  if (k === 0 || k === n) return 1;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}

function passAtK(records, k) {
  const byTask = {};
  for (const r of records) {
    (byTask[r.task_id] = byTask[r.task_id] || []).push(r);
  }
  const scores = {};
  for (const [tid, recs] of Object.entries(byTask)) {
    const n = recs.length;
    const c = recs.filter(r => (r.score ?? 0) >= 1.0).length;
    if (n === 0) { scores[tid] = 0; continue; }
    if (k === 1) { scores[tid] = c / n; continue; }
    scores[tid] = n < k ? c / n : 1 - comb(n - c, k) / comb(n, k);
  }
  return scores;
}

// ── data loading ──────────────────────────────────────────────────────────────

async function loadResultFiles() {
  // Try docs/results/index.json first, then legacy results/index.json
  let filenames = [];
  for (const path of ['results/index.json', '../results/index.json']) {
    try {
      const r = await fetch(path);
      if (r.ok) { filenames = await r.json(); break; }
    } catch (_) {}
  }
  if (!filenames.length) {
    // Probe known names
    filenames = ['mock', 'mock-p6', 'mock-verify', 'gpt-4o', 'gpt-4o-mini',
                 'claude-3-5-sonnet', 'meta-models/muse-spark-open-1026'];
  }
  const results = {};
  for (const name of filenames) {
    for (const base of ['results/', '../results/']) {
      try {
        const r = await fetch(base + name + '.json');
        if (r.ok) { results[name] = await r.json(); break; }
      } catch (_) {}
    }
  }
  return results;
}

async function loadTaskIndex() {
  for (const path of ['../tasks/index.json', '../../tasks/index.json']) {
    try {
      const r = await fetch(path);
      if (r.ok) return await r.json();
    } catch (_) {}
  }
  return [];
}

// ── render ────────────────────────────────────────────────────────────────────

function renderModel(modelName, records, taskIndex) {
  const isMock = modelName.startsWith('mock');
  const k = Math.max(...records.map(r => r.attempt ?? 1), 1);
  const p1 = passAtK(records, 1);
  const pk = passAtK(records, k);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const avgP1 = avg(Object.values(p1));
  const avgPk = avg(Object.values(pk));

  // Difficulty breakdown
  const diffCounts = {easy:{n:0,pass:0}, medium:{n:0,pass:0}, hard:{n:0,pass:0}};
  for (const t of taskIndex) {
    const d = t.difficulty;
    if (!diffCounts[d]) continue;
    const s = p1[t.id] ?? null;
    if (s !== null) { diffCounts[d].n++; if (s >= 1) diffCounts[d].pass++; }
  }

  // Failure reason counts
  const reasonCounts = {};
  for (const r of records) {
    const reason = r.failure_reason || 'unknown';
    reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
  }

  // Per-task rows
  const byTask = {};
  for (const r of records) (byTask[r.task_id] = byTask[r.task_id] || []).push(r);

  const rows = taskIndex.map(task => {
    const tid = task.id;
    const score1 = p1[tid] ?? null;
    const scorek = pk[tid] ?? null;
    const recs = byTask[tid] || [];
    const reasons = [...new Set(recs.map(r=>r.failure_reason).filter(r=>r&&r!=='none'))].slice(0,3);
    return el('tr', {},
      el('td', {}, el('code', {}, tid)),
      el('td', {}, tag('tag-'+(task.difficulty||'info'), task.difficulty||'?')),
      barCell(score1),
      barCell(scorek),
      el('td', {}, ...reasons.map(r => tag('tag-fail', r))),
    );
  });

  // Diff stats
  const diffStats = Object.entries(diffCounts)
    .filter(([,v]) => v.n > 0)
    .map(([d,v]) => el('span', {class:'summary-stat'}, tag('tag-'+d,d), ' ',
                       el('strong', {}, Math.round(v.pass/v.n*100)+'%')));

  // Reason table rows
  const reasonRows = Object.entries(reasonCounts)
    .sort(([,a],[,b]) => b-a)
    .map(([r,c]) => el('tr',{}, el('td',{},r), el('td',{style:{color:'#57606a'}}, String(c))));

  return el('div', {},
    el('h2', {}, modelName,
      isMock ? el('span', {class:'mock-banner'}, '⚠ MOCK DATA') : null),
    el('div', {class:'summary-row'},
      el('span', {class:'summary-stat'}, 'pass@1 ', el('strong',{},`${(avgP1*100).toFixed(1)}%`)),
      k > 1 ? el('span', {class:'summary-stat'}, `pass@${k} `, el('strong',{},`${(avgPk*100).toFixed(1)}%`)) : null,
      ...diffStats,
    ),
    el('table', {class:'reason-table'},
      el('thead', {}, el('tr', {}, el('th',{},'failure_reason'), el('th',{},'count'))),
      el('tbody', {}, ...reasonRows),
    ),
    el('table', {},
      el('thead', {},
        el('tr', {},
          el('th',{},'Task'), el('th',{},'Difficulty'),
          el('th',{},'pass@1'), el('th',{},k>1?`pass@${k}`:'score'),
          el('th',{},'Failure reason'),
        )
      ),
      el('tbody', {}, ...rows),
    )
  );
}

async function main() {
  const statusEl = document.getElementById('status');
  const root     = document.getElementById('root');
  const [taskIndex, results] = await Promise.all([loadTaskIndex(), loadResultFiles()]);
  const loaded = Object.keys(results).length;
  if (!loaded) {
    statusEl.textContent = 'No result files found. Run: python -m gradepack bench --model <name> --mock --publish';
    return;
  }
  statusEl.textContent = `${loaded} model file(s) loaded. ${taskIndex.length} tasks.`;
  for (const [name, records] of Object.entries(results)) {
    root.appendChild(renderModel(name, records, taskIndex));
  }
}

main();
</script>
</body>
</html>
